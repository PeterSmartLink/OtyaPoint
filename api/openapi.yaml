openapi: 3.1.0
info:
  title: OmniPoint Single-Business API
  version: 0.2.0
  description: |
    API contract for the owner's own shop. Currency is UGX. This is a development
    scaffold, not a live payment API. Provider operations and financial posting
    remain disabled until reviewed safety gates pass.
servers:
  - url: http://127.0.0.1:8787
    description: Local Wrangler development only
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Worker and D1 health check
      responses:
        '200':
          description: Worker and database are available
        '503':
          description: Database unavailable
  /api/products:
    get:
      summary: List active inventory products
      responses:
        '200':
          description: Product list
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a product
      description: Manager or higher. Inserts a product and audit event in a D1 batch.
      responses:
        '201':
          description: Product created
        '400':
          description: Invalid product input
        '403':
          description: Insufficient role
        '409':
          description: Duplicate SKU
  /api/sales:
    post:
      summary: Retail sale posting
      description: Intentionally disabled until atomic stock, receipt and balanced ledger behavior is tested.
      responses:
        '501':
          description: Sale not recorded; posting is disabled
  /api/payment-operations:
    post:
      summary: Create a local payment operation draft
      description: |
        Creates an idempotent DRAFT in Cloudflare D1 and appends an audit event.
        This route never contacts a provider, creates a provider attempt, or confirms payment.
        A timeout or ambiguous provider result must be represented as UNKNOWN by a future
        reviewed adapter and reconciled before another provider attempt.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operationType, amountMinorUnits]
              properties:
                operationType:
                  type: string
                  enum: [RETAIL_PAYMENT, CASH_IN, CASH_OUT, AIRTIME, DATA, BILL_PAYMENT, FLOAT_PURCHASE, REFUND, REVERSAL]
                amountMinorUnits:
                  type: integer
                  minimum: 1
                currency:
                  type: string
                  enum: [UGX]
                  default: UGX
                customerReference:
                  type: string
                  maxLength: 120
                linkedSaleId:
                  type: string
                  maxLength: 128
                selectedProvider:
                  type: string
                  enum: [INTERSWITCH, AIRTEL_MONEY, MTN_MOMO]
                selectedProduct:
                  type: string
                  maxLength: 80
      responses:
        '201':
          description: Draft created; no provider request was sent
        '200':
          description: Matching idempotent draft returned
        '400':
          description: Invalid request or missing idempotency key
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient role
        '409':
          description: Idempotency key reused with different details
    get:
      summary: List recent payment operation drafts and statuses
      description: Manager-only read. Returns up to 100 records and never contacts providers.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, PENDING, SUCCEEDED, FAILED, UNKNOWN, REVERSED]
      responses:
        '200':
          description: Payment operations
        '400':
          description: Invalid status filter
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Manager or higher required
  /api/agency-transactions:
    post:
      summary: Agency and value-added service operation
      description: |
        Intentionally disabled. Future supported operation types include mobile-money
        agency, airtime/data, bill payments and float movements. This route currently
        makes no provider request and records no operation.
      responses:
        '501':
          description: Provider adapter and safety controls required
  /api/payments/checkout:
    post:
      summary: Sale-linked customer payment
      description: Planned contract only; not implemented. Must use an approved hosted/tokenized checkout and verified status enquiry.
      responses:
        '501':
          description: Checkout is not enabled; no payment was initiated
  /api/provider/capabilities:
    get:
      summary: Planned provider capability registry
      description: Planned contract only; must report configured sandbox capabilities without exposing credentials.
      responses:
        '501':
          description: Provider capability registry is not implemented
  /api/ledger:
    get:
      summary: Read ledger entries
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [RETAIL, FINTECH_AGENCY]
      responses:
        '200':
          description: Ledger entries
        '403':
          description: Manager or higher required
  /api/reconciliation:
    post:
      summary: Create reconciliation
      description: Intentionally disabled until expected balances are ledger-derived and approval controls are tested.
      responses:
        '501':
          description: Reconciliation not enabled
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Short-lived signed test token
  responses:
    Unauthorized:
      description: Missing, expired or invalid bearer token
