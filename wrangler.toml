# The single OmniPoint Wrangler configuration.
# Local development uses this config. No public workers.dev endpoint or custom route.
name = "omnipoint-dev-api"
main = "cloudflare-api/src/index.ts"
compatibility_date = "2026-10-28"
workers_dev = false
keep_vars = false

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "omnipoint-dev"
database_id = "2c4de5d4-6898-4768-9a60-091bca7779b5"
migrations_dir = "cloudflare-api/migrations"

[[r2_buckets]]
binding = "PRIVATE_FILES"
bucket_name = "omnipoint-dev-private"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "omnipoint-dev-backups"

[[kv_namespaces]]
binding = "CACHE"
id = "69ca8a463e60410d907749d4e863faf4"

[[queues.producers]]
binding = "JOBS"
queue = "omnipoint-dev-jobs"

# No queue consumer until idempotency, retries and dead-letter behavior pass tests.
# No custom domain, public endpoint, or live payment-provider binding.
[[services]]
binding = "AUTH"
service = "otya-auth"
