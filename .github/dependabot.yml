version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Africa/Kampala"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
    groups:
      safe-runtime-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:45"
      timezone: "Africa/Kampala"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
