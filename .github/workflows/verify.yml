name: Verify OmniPoint

on:
  pull_request:
  push:
    branches: [main, "work/**", "chore/**", "feat/**"]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Cloudflare D1 migration filenames and sequence
        run: python3 migration/d1/validate_migrations.py
      - name: Test isolated SQLite schema compatibility
        run: python3 migration/d1/test_schema.py
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test Worker authentication and authorization failure paths
        run: npm run test:worker-auth
      - name: Lint
        run: npm run lint
      - name: Build legacy dashboard (migration checkpoint only)
        run: npm run build
