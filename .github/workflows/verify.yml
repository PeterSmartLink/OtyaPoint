name: Verify OmniPoint

on:
  pull_request:
  push:
    branches: [main, "work/**", "chore/**", "feat/**", "rebuild/**"]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate migration naming and order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = sorted(Path("cloudflare-api/migrations").glob("*.sql"))
          assert files, "No Cloudflare D1 migrations found"
          versions = []
          for path in files:
              match = re.fullmatch(r"(\d{4})_[a-z0-9_]+\.sql", path.name)
              assert match, f"Invalid migration filename: {path.name}"
              versions.append(int(match.group(1)))
          assert versions == list(range(1, len(versions) + 1)), f"Migration versions must be sequential: {versions}"
          print("Validated migrations:", ", ".join(p.name for p in files))
          PY

      - name: Test legacy SQLite migration compatibility
        run: python3 migration/d1/test_schema.py

      - name: Test OmniPoint core schema and stock invariants
        run: python3 cloudflare-api/tests/test_core_schema.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate remaining legacy dashboard Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/omnipoint_ci
        run: npm run db:validate

      - name: Type-check Cloudflare Worker
        run: npm run check:worker

      - name: Compile payment modules for isolated contract tests
        run: >-
          npx tsc cloudflare-api/src/payments/contracts.ts
          cloudflare-api/src/payments/disabled-provider.ts
          cloudflare-api/src/payments/quickteller-sandbox.ts
          --target ES2022 --module commonjs --lib ES2022,DOM
          --strict --skipLibCheck --outDir /tmp/omnipoint-payment-tests

      - name: Test payment request validation and disabled-provider safety
        run: node --test cloudflare-api/tests/payment_contract.test.cjs

      - name: Validate and bundle the single Wrangler configuration without deploying
        run: npx wrangler@4 deploy --dry-run --config wrangler.toml

      - name: Lint
        run: npm run lint

      - name: Build dashboard and backend package
        run: npm run build
