name: Deploy OmniPoint isolated Cloudflare development Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnipoint-dev-worker-deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: omnipoint-dev
    timeout-minutes: 20
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require development-only Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN in the omnipoint-dev environment."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID in the omnipoint-dev environment."; exit 1; }
          echo "Credentials are present; values will not be printed."

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify D1 schema invariants
        run: python3 cloudflare-api/tests/test_core_schema.py

      - name: Type-check Worker
        run: npm run check:worker

      - name: Require a configured private preview endpoint before deployment
        shell: bash
        env:
          PREVIEW_URL: ${{ vars.OTYAPOINT_PREVIEW_URL }}
          ACCESS_CONFIRMED: ${{ vars.OTYAPOINT_PREVIEW_ACCESS_CONFIRMED }}
        run: |
          set -euo pipefail
          # A successful Wrangler deploy is not useful if workers.dev is disabled
          # and no route exists. Do not create an inaccessible Worker by accident.
          if ! grep -Fq '[[routes]]' wrangler.toml; then
            echo "::error::No [[routes]] entry exists in wrangler.toml. Configure an isolated preview hostname and have Cloudflare Access protection independently verified before deploying."
            exit 1
          fi
          test -n "$PREVIEW_URL" || { echo "::error::Set OTYAPOINT_PREVIEW_URL in the omnipoint-dev environment."; exit 1; }
          test "$ACCESS_CONFIRMED" = "true" || { echo "::error::Set OTYAPOINT_PREVIEW_ACCESS_CONFIRMED=true only after verifying the preview route is protected by Cloudflare Access."; exit 1; }
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          url = urlparse(os.environ["PREVIEW_URL"])
          host = (url.hostname or "").lower()
          if url.scheme != "https" or not host:
              raise SystemExit("Preview URL must be an absolute HTTPS URL.")
          if host in {"petersmartlink.com", "www.petersmartlink.com"} or not any(token in host for token in ("preview", "dev")):
              raise SystemExit("Preview host must be an isolated preview/dev hostname, not a production website hostname.")
          print("Isolated HTTPS preview endpoint settings are present; no secrets were printed.")
          PY

      - name: Validate Worker bundle without deploying
        run: npx wrangler@4 deploy --dry-run --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy only the isolated development Worker
        run: npx wrangler@4 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Confirm deployment boundary
        if: always()
        run: |
          echo "This workflow targets only the root wrangler.toml configuration."
          echo "No D1 migrations, DNS routes, custom domains, live payment-provider calls, or production deployments are performed by this workflow."
